---

- name: Check for required variables
  fail: msg="Variable {{ item }} must be defined to use this role"
  when: vars[var_check] is undefined
  with_items:
    - rustfs_namespace
    - namespace
    - ca_configmap_name
  loop_control:
    loop_var: var_check

- name: Get RustFS CA certificate
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: rustfs-cert
    namespace: "{{ rustfs_namespace }}"
  register: rustfs_cert

# For tests that use CustomCA in a configmap
- name: Create CustomCA configmap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ ca_configmap_name }}"
        namespace: "{{ namespace }}"
      data:
        ca.crt: "{{ rustfs_cert.resources[0].data['rustfs_cert.pem'] | b64decode }}"
